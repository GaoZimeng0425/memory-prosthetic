name: "Release"

on:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/package.json"
      - "apps/browser-extension/package.json"
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: check
        run: |
          # 兼容仓库只有1个提交的情况（HEAD~1不存在时设为空）
          if [ $(git rev-list --count HEAD) -eq 1 ]; then
            OLD_VERSION=""
          else
            OLD_VERSION=$(git show HEAD~1:apps/desktop/package.json 2>/dev/null | node -p "try { JSON.parse(require('fs').readFileSync(0, 'utf8')).version } catch (e) { '' }")
          fi

          # 读取新版本（兼容解析失败）
          NEW_VERSION=$(node -p "try { require('./apps/desktop/package.json').version } catch (e) { '' }")

          echo "Version: $OLD_VERSION -> $NEW_VERSION"
          # 版本为空或不一致时标记为变更
          if [ -z "$OLD_VERSION" ] || [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  publish-tauri:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: install frontend dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 修复：复用check-version输出的版本号
          tagName: v${{ needs.check-version.outputs.version }}
          releaseName: "Memory Prosthetic v${{ needs.check-version.outputs.version }}"
          releaseBody: "See the assets below to download the latest version."
          releaseDraft: true
          prerelease: false
          args: "--target aarch64-apple-darwin,x86_64-apple-darwin"
          projectPath: "apps/desktop"

  publish-extension:
    # 优化：移除对publish-tauri的强依赖（两者可并行，仅依赖版本检查）
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install dependencies
        run: bun install

      - name: build extension
        run: bun run build:browser-extension

      - name: Upload extension artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/browser-extension/.output/*.zip
          # 修复：复用check-version的版本号，避免重复读取文件
          tag_name: v${{ needs.check-version.outputs.version }}
          # 确保关联到已创建的Release（如果不存在则创建）
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
